name: PODOLSKY AI - Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PODOLSKY-AI.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Obter projeto
        uses: actions/checkout@v4

      - name: Verificar arquivo ZIP
        run: |
          set -e
          ls -lh
          test -f PODOLSKY-AI.zip
          unzip -t PODOLSKY-AI.zip

      - name: Extrair projeto
        run: |
          set -e
          unzip -o PODOLSKY-AI.zip -d .
          test -f app/build.gradle
          test -f settings.gradle
          test -f build.gradle

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Diagnosticar Android SDK
        run: |
          echo "=== SISTEMA ==="
          java -version
          echo "=== ANDROID HOME ==="
          echo "$ANDROID_HOME"
          echo "=== SDK INSTALADO ==="
          ls -la "$ANDROID_HOME" || true
          echo "=== PROCURAR SDKMANAGER ==="
          find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null || true
          echo "=== VARIÁVEIS ==="
          env | grep -E 'ANDROID|JAVA_HOME' || true

      - name: Instalar componentes Android
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: PODOLSKY-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
